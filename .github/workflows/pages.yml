name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site-dist
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-oss:
    name: Deploy to Aliyun OSS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site-dist
          path: dist

      - name: Deploy to OSS bucket
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ vars.ALIYUN_OSS_BUCKET || 'www-crewbee-art' }}
          ALIYUN_OSS_REGION: ${{ vars.ALIYUN_OSS_REGION || 'cn-beijing' }}
          ALIYUN_OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT || 'https://oss-cn-beijing.aliyuncs.com' }}
        run: bash scripts/deploy-oss.sh

      - name: Install Alibaba Cloud CLI
        run: |
          set -euo pipefail
          /bin/bash -c "$(curl -fsSL https://aliyuncli.alicdn.com/install.sh)"
          aliyun version

      - name: Configure Alibaba Cloud CLI
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail

          aliyun configure set \
            --profile default \
            --mode AK \
            --region cn-hangzhou \
            --access-key-id "${ALIYUN_ACCESS_KEY_ID}" \
            --access-key-secret "${ALIYUN_ACCESS_KEY_SECRET}"

      - name: Refresh CDN cache
        env:
          ALIYUN_CDN_DOMAIN: ${{ vars.ALIYUN_CDN_DOMAIN || secrets.ALIYUN_CDN_DOMAIN }}
        run: |
          set -euo pipefail

          if [ -z "${ALIYUN_CDN_DOMAIN}" ]; then
            echo "Missing variable: ALIYUN_CDN_DOMAIN"
            exit 1
          fi

          # 目录刷新：刷新整个站点目录。
          # 对静态官网来说，发布后刷新根目录最省心。
          aliyun cdn RefreshObjectCaches \
            --ObjectPath "${ALIYUN_CDN_DOMAIN}/" \
            --ObjectType Directory \
            --region cn-hangzhou

          echo "CDN refresh submitted: ${ALIYUN_CDN_DOMAIN}/"
